# DO NOT MODIFY. this file is generated using the `pnpm generate` command
# generated from [src/workflows/verify-generation.ts]
name: Verify Generation
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  id-token: none
  contents: read
  pull-requests: write
  actions: read
  checks: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          cache: true
          install: false
      - name: Install dependencies
        shell: bash
        run: |-
          pnpm install --frozen-lockfile
      - name: Verify generated workflow files are up to date
        id: verify
        shell: bash
        run: |
          pnpm run generate

          # Mark new files as intent-to-add so they show up in the diff against HEAD
          git add --intent-to-add .
          diff=$(git diff HEAD)

          if [ -n "$diff" ]; then
            {
              echo "diff<<GENERATION_DIFF_EOF"
              echo "$diff"
              echo "GENERATION_DIFF_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Generated workflow files are out of date. Run 'pnpm run generate' and commit the result."
          fi
      - name: Post diff to job summary
        if: ${{ steps.verify.outputs.diff != '' }}
        env:
          DIFF: ${{ steps.verify.outputs.diff }}
        shell: bash
        run: |
          {
            cat <<'EOF'
          ## Generated workflow files are out of date

          Run `pnpm run generate` and commit the result.

          ```diff
          EOF
            echo "$DIFF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment diff on PR
        if: ${{ github.event_name == 'pull_request' && steps.verify.outputs.diff != '' }}
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: codegen-gha-verify-generation
          hide_and_recreate: true
          hide_classify: OUTDATED
          message: |-
            ## Generated workflow files are out of date

            Run `pnpm run generate` and commit the result.

            ```diff
            ${{ steps.verify.outputs.diff }}
            ```
      - name: Resolve the diff comment on PR
        if: ${{ github.event_name == 'pull_request' && steps.verify.outputs.diff == '' }}
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: codegen-gha-verify-generation
          hide: true
          hide_classify: RESOLVED
      - name: Fail Job if we did not generate everything
        if: ${{ steps.verify.outputs.diff != '' }}
        shell: bash
        run: |-
          exit 1
