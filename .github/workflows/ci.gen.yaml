# DO NOT MODIFY. this file is generated using the `cgha generate` command
# generated from [src/workflows/ci.ts]
name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  id-token: none
  contents: read
  pull-requests: read
  actions: read
  checks: read
env: {}
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - name: Install dependencies
        shell: bash
        run: |-
          pnpm install --frozen-lockfile
      - name: Run tests
        shell: bash
        run: |-
          pnpm exec vitest run
