# DO NOT MODIFY. this file is generated using the `pnpm generate` command
# generated from [src/workflows/ci.ts]
name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  id-token: none
  contents: read
  pull-requests: read
  actions: read
  checks: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - name: Setup pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          cache: true
          install: false
      - name: Install dependencies
        shell: bash
        run: |-
          pnpm install --frozen-lockfile
      - name: Run tests
        shell: bash
        run: |-
          pnpm test
