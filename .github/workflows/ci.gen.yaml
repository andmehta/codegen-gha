# DO NOT MODIFY. this file is generated using the `pnpm generate` command
# generated from [src/workflows/ci.ts]
name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  id-token: none
  contents: read
  pull-requests: read
  actions: read
  checks: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          cache: true
          install: false
          runtime: node@lts
      - name: Install dependencies
        shell: bash
        run: |-
          pnpm install --frozen-lockfile
      - name: Run tests
        shell: bash
        run: |-
          pnpm test
