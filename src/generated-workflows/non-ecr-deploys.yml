  meepo_build_and_deploy:
    name: Meepo build and deploy
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    if: ${{ fromJSON(inputs.plan).meepo_build_and_deploy || false }}
    steps:
      - name: Register post action for workspace cleanup
        uses: velocibear/clean-after-action@9e9132154594236c9e4b1c904ead3c5c4000a18c
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up node and expand pnpm cache if possible
        uses: ./.github/actions/setup-node-expand-pnpm-cache
      - name: Install deps
        uses: ./.github/actions/install-deps
        with:
          since: ${{ inputs.since-commit-sha }}
          use-distributed-caching: 'false'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ASSUME_ROLE_PROD }}
          role-session-name: gharolesessionprod
          aws-region: ${{ env.AWS_REGION }}
      - name: Meepo build and deploy
        uses: ./.github/actions/meepo-build-and-deploy
        with:
          command: buildAndDeploy
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ASSUME_ROLE_PROD: arn:aws:iam::767397844093:role/lattice-repo-github-oidc
        with:
          role-to-assume: ${{ env.AWS_ASSUME_ROLE_PROD }}
          role-session-name: gharolesessionsecondary
          aws-region: eu-central-1
      - name: Meepo build and deploy (EMEA)
        uses: ./.github/actions/meepo-build-and-deploy
        env:
          AWS_REGION: eu-central-1
          DEPLOYMENT: emea-prod-1
          ECR_ACCOUNT: '767397844093'
        with:
          command: buildAndDeploy:deployment
