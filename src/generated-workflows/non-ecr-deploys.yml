          pnpm -F mars-language-files deploy-prod ||   (sleep 15 && pnpm -F mars-language-files deploy-prod) ||   (sleep 15 && pnpm -F mars-language-files deploy-prod)
  mars_lattice_website_build_and_deploy:
    name: mars_lattice_website_build_and_deploy
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    if: ${{ fromJSON(inputs.plan).mars_lattice_website_build_and_deploy || false }}
    env:
      GITHUB_CURRENT_COMMIT_SHA: ${{ inputs.current-commit-sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.MARS_LATTICE_WEBSITE_PROXY_CF_TOKEN }}
    steps:
      - name: Register post action for workspace cleanup
        uses: velocibear/clean-after-action@9e9132154594236c9e4b1c904ead3c5c4000a18c
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up node and expand pnpm cache if possible
        uses: ./.github/actions/setup-node-expand-pnpm-cache
      - name: Install deps
        uses: ./.github/actions/install-deps
        with:
          since: ${{ inputs.since-commit-sha }}
          use-distributed-caching: 'false'
      - name: Deploy mars-lattice-website
        shell: bash
        run: |
          pnpm -F mars-lattice-website deploy-prod ||   (sleep 15 && pnpm -F mars-lattice-website deploy-prod) ||   (sleep 15 && pnpm -F mars-lattice-website deploy-prod)
  mars_integrations_gateway_build_and_deploy:
    name: mars_integrations_gateway_build_and_deploy
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    if: ${{ fromJSON(inputs.plan).mars_integrations_gateway_build_and_deploy || false }}
    env:
      GITHUB_CURRENT_COMMIT_SHA: ${{ inputs.current-commit-sha }}
