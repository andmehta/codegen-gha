        with:
          fetch-depth: 2
      - name: Set up node and expand pnpm cache if possible
        uses: ./.github/actions/setup-node-expand-pnpm-cache
      - name: Install deps
        uses: ./.github/actions/install-deps
        with:
          since: ${{ inputs.since-commit-sha }}
          use-distributed-caching: 'false'
      - name: Install only deps for this app
        shell: bash
        run: |
          pnpm -F mars-integrations-gateway^... install
          pnpm relay
          pnpm -F mars-integrations-gateway^... build
          pnpm -F mars-integrations-gateway... install
      - name: Build mars-integrations-gateway
        shell: bash
        run: |
          pnpm -F mars-integrations-gateway build
      - name: Deploy mars-integrations-gateway
        shell: bash
        run: |
          echo 'Deploying mars-integrations-gateway for real'
